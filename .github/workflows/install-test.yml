name: Install test

# Installs Falcon from scratch on a clean Mac and a clean Windows machine and checks that it comes up.
# No AI key is used, so this covers everything up to (not including) Falcon actually thinking.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: System
        run: sw_vers && uname -m && (node -v || true)

      # A customer's Mac usually has no Homebrew, no Node.js and no developer tools, and nobody to type
      # an administrator password. This machine has all three, so hide them: a bare PATH, and stand-ins
      # for sudo and brew that leave a mark and fail if anything tries to use them.
      - name: Run the Falcon installer as on a Mac with no developer tools
        run: |
          mkdir -p "$RUNNER_TEMP/trap"
          for tool in sudo brew; do
            printf '#!/bin/bash\necho "%s $*" >> "%s/used"\nexit 1\n' "$tool" "$RUNNER_TEMP/trap" > "$RUNNER_TEMP/trap/$tool"
            chmod +x "$RUNNER_TEMP/trap/$tool"
          done
          env -i HOME="$HOME" USER="$USER" TMPDIR="${TMPDIR:-/tmp}" LANG=en_US.UTF-8 \
            PATH="$RUNNER_TEMP/trap:/usr/bin:/bin:/usr/sbin:/sbin" \
            FALCON_NO_LAUNCH=1 FALCON_PRETEND_BARE=1 \
            /bin/bash installer/install.sh || (cat "${TMPDIR:-/tmp}/falcon-install.log"; exit 1)

      - name: No administrator password and no Homebrew were needed
        run: |
          if [ -f "$RUNNER_TEMP/trap/used" ]; then echo "The installer tried to use:"; cat "$RUNNER_TEMP/trap/used"; exit 1; fi
          LAUNCHER="$HOME/Applications/Falcon.app/Contents/MacOS/Falcon"
          grep -q "exec \"$HOME/.openclaw/tools/node/bin/node\"" "$LAUNCHER" || { echo "Falcon is not using the engine's own private Node.js:"; cat "$LAUNCHER"; exit 1; }
          test -x "$HOME/.openclaw/bin/openclaw"
          echo "Engine and Node.js live under the user's own folder."

      - name: Installed files and app
        run: |
          APP="$HOME/Library/Application Support/Falcon/app"
          test -f "$APP/src/app/launch.js"
          test -f "$APP/falcon-agent/install-falcon.mjs"
          test -x "$HOME/Applications/Falcon.app/Contents/MacOS/Falcon"
          cat "$HOME/Applications/Falcon.app/Contents/MacOS/Falcon"
          plutil -lint "$HOME/Applications/Falcon.app/Contents/Info.plist"
          ls -la "$HOME/Applications/Falcon.app/Contents/Resources" "$HOME/Desktop" "$HOME/Documents/Falcon Samples"

      - name: Put the launcher's tools on PATH for the next steps
        run: |
          LINE="$(grep '^export PATH=' "$HOME/Applications/Falcon.app/Contents/MacOS/Falcon")"
          eval "$LINE"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          which node openclaw && node -v && openclaw --version

      - name: Window comes up before any setup
        run: node scripts/ci-check.mjs "$HOME/Library/Application Support/Falcon/app"

      - name: Engine setup without a key
        run: |
          openclaw onboard --non-interactive --accept-risk --mode local --auth-choice skip \
            --gateway-bind loopback --gateway-auth token --install-daemon --agent-name Falcon
          openclaw gateway start || true
          for i in $(seq 1 30); do openclaw gateway status >/dev/null 2>&1 && break; sleep 2; done
          openclaw gateway status || true

      - name: Install the Falcon pack with settings
        run: node "$HOME/Library/Application Support/Falcon/app/falcon-agent/install-falcon.mjs"

      - name: Falcon's rules landed in the workspace
        run: |
          grep -c "falcon:start" "$HOME/.openclaw/workspace/AGENTS.md"
          grep "this is a Mac" "$HOME/.openclaw/workspace/AGENTS.md"
          grep "slides.mjs" "$HOME/.openclaw/workspace/AGENTS.md"
          ls -R "$HOME/.openclaw/workspace/skills"
          openclaw approvals get --gateway | grep -E "Defaults|mjs" || true

      - name: Mac skill - calendar, mail, reminders (needs macOS permission; informational)
        continue-on-error: true
        run: |
          for what in calendar mail reminders; do node "$HOME/.openclaw/workspace/skills/daily/daily.mjs" --what $what; done
      - name: Window sees the engine
        run: node scripts/ci-check.mjs "$HOME/Library/Application Support/Falcon/app" --expect-ready

      - name: Mac skill - find a file
        run: |
          OUT="$(node "$HOME/.openclaw/workspace/skills/files/find-files.mjs" --query "invoice" --ext pdf)"
          echo "$OUT"
          echo "$OUT" | grep -q '"ok":true' && echo "$OUT" | grep -qi 'Invoice'

      - name: Mac skill - read what is inside the sample invoice
        run: |
          OUT="$(node "$HOME/.openclaw/workspace/skills/files/read-file.mjs" --path "$HOME/Documents/Falcon Samples/Invoice October 2026.pdf")"
          echo "$OUT"
          echo "$OUT" | grep -q '"ok":true' && echo "$OUT" | grep -q '4,800.00'

      - name: Mac skill - find a presentation by name (no app needed)
        run: |
          OUT="$(node "$HOME/.openclaw/workspace/skills/presentations/slides.mjs" --find "zzz-no-such-deck" --slide 2)"
          echo "$OUT"
          echo "$OUT" | grep -q "No presentation with"

      - name: Mac skill - open the sample deck (needs Keynote or PowerPoint; informational)
        continue-on-error: true
        run: |
          ls /Applications | grep -iE "keynote|powerpoint" || echo "no presentation app on this machine"
          node "$HOME/.openclaw/workspace/skills/presentations/slides.mjs" --find "quarterly review" --slide 3

      - name: Mac skill - look at the screen (informational)
        continue-on-error: true
        run: node "$HOME/.openclaw/workspace/skills/screen/screenshot.mjs"

      # Nobody here can click macOS's permission prompts, so the apps themselves cannot be driven. What
      # can be proven: every command for Mail, Notes, Calendar, Reminders, Music, Finder and System Events
      # is valid AppleScript that those apps understand (osacompile checks it against each app's dictionary).
      - name: Mac skill - every app command is valid AppleScript for its app
        run: |
          APPS="$HOME/.openclaw/workspace/skills/apps/apps.mjs"
          mkdir -p "$RUNNER_TEMP/osa"
          node "$APPS" --print-script > "$RUNNER_TEMP/osa/all.json"
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!j.ok)process.exit(1);for(const [k,v] of Object.entries(j.scripts))fs.writeFileSync(process.argv[2]+"/"+k+".applescript",v);console.log(Object.keys(j.scripts).join(" "))' "$RUNNER_TEMP/osa/all.json" "$RUNNER_TEMP/osa"
          failed=0
          for f in "$RUNNER_TEMP"/osa/*.applescript; do
            if osacompile -o "${f%.applescript}.scpt" "$f" 2> "$f.err"; then echo "ok    $(basename "$f")"; else echo "FAILED $(basename "$f"): $(cat "$f.err")"; failed=1; fi
          done
          exit $failed

      - name: Mac skill - which app is in front, and a bad request is refused plainly (informational)
        continue-on-error: true
        run: |
          APPS="$HOME/.openclaw/workspace/skills/apps/apps.mjs"
          node "$APPS" --do frontmost || true
          node "$APPS" --do calendar-add --title "Test" --start "not a date" || true

      - name: Mac skill - make a Word document, a spreadsheet and a deck
        run: |
          DOCS="$HOME/.openclaw/workspace/skills/documents/make-document.mjs"
          for t in docx xlsx pptx; do
            OUT="$(node "$DOCS" --spec "test/fixtures/documents/$t.json")"
            echo "$OUT"
            echo "$OUT" | grep -q '"ok":true'
            FILE="$(echo "$OUT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).path))')"
            test -s "$FILE"
            unzip -tq "$FILE"
          done
          OUT="$(node "$HOME/.openclaw/workspace/skills/files/read-file.mjs" --path "$HOME/Documents/Falcon Documents/Falcon CI check.docx")"
          echo "$OUT"
          echo "$OUT" | grep -q 'Quarterly numbers'

      - name: Desktop control and free web search (informational on a Mac)
        continue-on-error: true
        run: |
          openclaw gateway call computer.status --params '{"probe":false}' || true
          openclaw config get tools.web.search.provider || true

      - name: Unit checks
        run: node --test "test/*.test.js"

      - name: Uninstall removes Falcon and the engine, and with --delete-data what he knew
        run: |
          bash "$HOME/Library/Application Support/Falcon/app/installer/uninstall.sh" --yes --delete-data
          sleep 3
          for gone in "$HOME/Applications/Falcon.app" "$HOME/Library/Application Support/Falcon" "$HOME/.openclaw" "$HOME/.falcon" "$HOME/Desktop/Falcon"; do
            if [ -e "$gone" ]; then echo "still there: $gone"; exit 1; fi
          done
          if ls "$HOME"/Library/LaunchAgents/*openclaw* >/dev/null 2>&1; then echo "start-at-login entry still there"; ls "$HOME"/Library/LaunchAgents; exit 1; fi
          if pgrep -f "openclaw.*gateway" >/dev/null; then echo "engine still running"; exit 1; fi
          echo "Falcon, the engine and their data are gone."

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the Falcon installer
        shell: powershell
        run: |
          node -v
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\install.ps1 -NoLaunch

      - name: Installed files, Node and shortcuts
        shell: powershell
        run: |
          $app = "$env:LOCALAPPDATA\Falcon\app"
          if (-not (Test-Path "$app\src\app\launch.js")) { throw "launch.js missing" }
          if (-not (Test-Path "$app\falcon.ico")) { throw "icon missing" }
          $link = Join-Path ([Environment]::GetFolderPath("Desktop")) "Falcon.lnk"
          if (-not (Test-Path $link)) { throw "Desktop shortcut missing" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          "shortcut: " + $s.TargetPath + " " + $s.Arguments
          $node = ($s.Arguments -split '"')[1]
          & $node -v
          "FALCON_NODE=$node" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem (Join-Path ([Environment]::GetFolderPath("MyDocuments")) "Falcon Samples")

      - name: Window comes up before any setup
        shell: powershell
        run: |
          & $env:FALCON_NODE scripts\ci-check.mjs "$env:LOCALAPPDATA\Falcon\app"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Engine install (the step behind the Start button)
        shell: powershell
        run: |
          $env:Path = (Split-Path $env:FALCON_NODE) + ";" + $env:Path
          # The engine version Falcon was tested with, as Falcon's own setup installs it (package.json, "falconEngine").
          $tested = (Get-Content package.json -Raw | ConvertFrom-Json).falconEngine
          "engine version: $tested"
          & ([scriptblock]::Create((Invoke-RestMethod https://openclaw.ai/install.ps1))) -NoOnboard -Tag $tested
          $installed = (Get-Content "$env:APPDATA\npm\node_modules\openclaw\package.json", "$env:LOCALAPPDATA\Programs\nodejs\node_modules\openclaw\package.json", "C:\npm\prefix\node_modules\openclaw\package.json" -Raw -ErrorAction SilentlyContinue | Select-Object -First 1 | ConvertFrom-Json).version
          "installed engine: $installed"
          if ($installed -and $installed -ne $tested) { throw "the engine installed is $installed, not the tested $tested" }
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          & $env:FALCON_NODE -e "import('file:///' + process.argv[1].replace(/\\/g,'/')).then(m => { const e = m.findEngine(); console.log('engine found by Falcon:', JSON.stringify(e)); process.exit(e ? 0 : 1); })" "$env:LOCALAPPDATA\Falcon\app\src\app\engine.js"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Engine setup without a key, then the Falcon pack
        shell: powershell
        run: |
          $env:Path = (Split-Path $env:FALCON_NODE) + ";" + [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          openclaw --version
          openclaw onboard --non-interactive --accept-risk --mode local --auth-choice skip --gateway-bind loopback --gateway-auth token --install-daemon --agent-name Falcon
          openclaw gateway start
          foreach ($i in 1..30) { openclaw gateway status *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 2 }
          & $env:FALCON_NODE "$env:LOCALAPPDATA\Falcon\app\falcon-agent\install-falcon.mjs"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Select-String -Path "$env:USERPROFILE\.openclaw\workspace\AGENTS.md" -Pattern "this is a Windows PC" | Select-Object -First 1
      - name: Falcon moves the engine into his own folder, under his own start-up name
        shell: powershell
        run: |
          # The engine above was set up the way older Falcons did it (a real .openclaw folder, the
          # "OpenClaw Gateway" start-up item), as on customers' PCs. Falcon moves it at his next start.
          $env:Path = (Split-Path $env:FALCON_NODE) + ";" + [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          $app = "$env:LOCALAPPDATA\Falcon\app\src\app"
          & $env:FALCON_NODE --input-type=module -e "const h = await import('file:///' + process.argv[1].replace(/\\/g, '/') + '/enginehome.js'); const e = await import('file:///' + process.argv[1].replace(/\\/g, '/') + '/engine.js'); const r = await h.moveEngineHome({ runEngine: e.runEngine, engineReady: e.engineReady, log: console.log }); console.log('result:', r); process.exit(r === 'moved' ? 0 : 1);" $app
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $link = Get-Item "$env:USERPROFILE\.openclaw" -Force
          "old place: $($link.Attributes) -> $($link.Target)"
          if (-not ($link.Attributes -band [IO.FileAttributes]::ReparsePoint) -or -not ($link.Attributes -band [IO.FileAttributes]::Hidden)) { throw ".openclaw is not a hidden link" }
          if (-not (Test-Path "$env:USERPROFILE\.falcon\engine\openclaw.json")) { throw "the engine's settings are not in Falcon's folder" }
          $startup = [Environment]::GetFolderPath("Startup")
          Get-ChildItem $startup | ForEach-Object Name
          cmd /c "schtasks /query /tn ""Falcon Engine"" >nul 2>&1"; $task = $LASTEXITCODE -eq 0
          if (-not ($task -or (Test-Path "$startup\Falcon Engine.vbs") -or (Test-Path "$startup\Falcon Engine.cmd"))) { throw "no start-up item named Falcon Engine" }
          cmd /c "schtasks /query /tn ""OpenClaw Gateway"" >nul 2>&1"; if ($LASTEXITCODE -eq 0 -or (Test-Path "$startup\OpenClaw Gateway.vbs") -or (Test-Path "$startup\OpenClaw Gateway.cmd")) { throw "a start-up item still carries the engine's name" }
          $env:OPENCLAW_WINDOWS_TASK_NAME = "Falcon Engine"
          foreach ($i in 1..60) { openclaw gateway status *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 3 }
          openclaw gateway status
          if ($LASTEXITCODE -ne 0) { throw "the engine did not start again after the move" }
          # A new conversation must still be accepted (no key here, so it fails for that reason only).
          # Seen on a real PC: through the link the engine refused every new one ("workspace path alias").
          $talk = cmd /c "openclaw agent --agent falcon --message hello --json --timeout 90 2>&1" | Out-String
          $talk.Substring(0, [Math]::Min(600, $talk.Length))
          if ($talk -match "WORKSPACE_ALIAS|path alias points") { throw "the engine refuses new conversations after the move" }
          "new conversations are accepted (refused only for want of a key, as expected here)"
          exit 0

      - name: Window sees the engine
        shell: powershell
        run: |
          & $env:FALCON_NODE scripts\ci-check.mjs "$env:LOCALAPPDATA\Falcon\app" --expect-ready
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Windows skill - find a file
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "$env:USERPROFILE\.openclaw\workspace\skills\files\find-files.ps1" -Query "invoice" -Ext "pdf"
          $out
          if ($out -notmatch '"ok":true' -or $out -notmatch 'Invoice') { exit 1 }

      - name: Windows skill - read what is inside the sample invoice
        shell: powershell
        run: |
          $found = powershell -NoProfile -ExecutionPolicy Bypass -File "$env:USERPROFILE\.openclaw\workspace\skills\files\find-files.ps1" -Query "invoice" -Ext "pdf" | ConvertFrom-Json
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "$env:USERPROFILE\.openclaw\workspace\skills\files\read-file.ps1" -Path $found.files[0].path
          $out
          if ($out -notmatch '"ok":true' -or $out -notmatch '4,800.00') { exit 1 }

      - name: Windows skill - make a Word document, a spreadsheet and a deck
        shell: powershell
        run: |
          foreach ($t in "docx", "xlsx", "pptx") {
            $out = powershell -NoProfile -ExecutionPolicy Bypass -File "$env:USERPROFILE\.openclaw\workspace\skills\documents\make-document.ps1" -Spec "$PWD\test\fixtures\documents\$t.json"
            $out
            if ($out -notmatch '"ok":true') { exit 1 }
            if (-not (Test-Path ($out | ConvertFrom-Json).path)) { exit 1 }
          }

      - name: Desktop control is switched on, and web search works without a key
        shell: powershell
        run: |
          $env:Path = (Split-Path $env:FALCON_NODE) + ";" + [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          $status = openclaw gateway call computer.status --params '{\"probe\":false}' | Out-String
          $status
          if ($status -notmatch '"configured": true') { exit 1 }
          $provider = openclaw config get tools.web.search.provider | Out-String
          $provider
          if ($provider -notmatch 'parallel-free') { exit 1 }

      - name: Unit checks
        shell: powershell
        run: |
          & $env:FALCON_NODE --test (Get-ChildItem test\*.test.js | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Self-repair workshop - portable Git, a change switched in, and a broken one put back
        shell: powershell
        timeout-minutes: 25
        run: |
          & $env:FALCON_NODE scripts\ci-workshop.mjs "$env:LOCALAPPDATA\Falcon\app"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Falcon is listed in Settings > Apps, and his icon can sit by the clock
        shell: powershell
        run: |
          $key = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Falcon"
          "listed as: $($key.DisplayName) $($key.DisplayVersion)"
          "uninstall: $($key.UninstallString)"
          if ($key.DisplayName -ne "Falcon") { throw "not listed in Settings > Apps" }
          $script = ($key.UninstallString -split '"')[3]
          if (-not (Test-Path $script)) { throw "the uninstaller the entry points to is missing: $script" }
          $startup = Join-Path ([Environment]::GetFolderPath("Startup")) "Falcon.lnk"
          if (-not (Test-Path $startup)) { throw "no sign-in entry for the icon" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($startup)
          $p = Start-Process $s.TargetPath -ArgumentList $s.Arguments -PassThru
          Start-Sleep 8
          $icon = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like "*tray.ps1*" }
          if (-not $icon) { throw "the icon did not stay running" }
          "icon running: pid $($icon.ProcessId)"

      - name: Uninstall removes Falcon and the engine, and with -DeleteData what he knew
        shell: powershell
        run: |
          $nodeBefore = $env:FALCON_NODE
          # Falcon installs Node.js only when the computer has none recent enough, and leaves a note when he does.
          $nodeWasFalcons = Test-Path "$env:LOCALAPPDATA\Falcon\node-installed-by-falcon.txt"
          "Node.js installed by Falcon: $nodeWasFalcons"
          &"$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Falcon\app\installer\uninstall.ps1" -Quiet -DeleteData -NoMessage
          # The uninstaller hands over to a copy of itself and finishes in the background: wait for it.
          foreach ($i in 1..60) { if (-not (Test-Path "$env:LOCALAPPDATA\Falcon\app") -and -not (Test-Path "$env:USERPROFILE\.openclaw") -and -not (Test-Path "$env:USERPROFILE\.falcon")) { break }; Start-Sleep 2 }
          Start-Sleep 4
          $problems = @()
          if (Test-Path "$env:LOCALAPPDATA\Falcon\app") { $problems += "app folder still there" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Falcon") { $problems += "still listed in Settings > Apps" }
          foreach ($l in (Join-Path ([Environment]::GetFolderPath("Desktop")) "Falcon.lnk"), (Join-Path ([Environment]::GetFolderPath("Startup")) "Falcon.lnk"), (Join-Path ([Environment]::GetFolderPath("StartMenu")) "Programs\Falcon.lnk")) { if (Test-Path $l) { $problems += "shortcut still there: $l" } }
          if ((Test-Path "$env:USERPROFILE\.openclaw") -or (Test-Path "$env:USERPROFILE\.falcon")) { $problems += "engine data still there" }
          if ([Environment]::GetEnvironmentVariable("OPENCLAW_WINDOWS_TASK_NAME", "User")) { $problems += "the start-up name setting is still there" }
          foreach ($name in "Falcon Engine", "OpenClaw Gateway") { if (Test-Path (Join-Path ([Environment]::GetFolderPath("Startup")) "$name.vbs")) { $problems += "start-up item still there: $name" } }
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (Get-Command openclaw.cmd -ErrorAction SilentlyContinue) { $problems += "engine still installed: $((Get-Command openclaw.cmd).Source)" }
          if (Get-NetTCPConnection -LocalPort 18789 -State Listen -ErrorAction SilentlyContinue) { $problems += "engine still running" }
          if (Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like "*tray.ps1*" }) { $problems += "icon still running" }
          if ($nodeWasFalcons -and (Test-Path $nodeBefore)) { $problems += "left behind the Node.js that Falcon had installed" }
          if (-not $nodeWasFalcons -and -not (Test-Path $nodeBefore)) { $problems += "removed a Node.js that Falcon had not installed" }
          if ($problems) { $problems; exit 1 }
          "Falcon, the engine and their data are gone; Node.js was " + $(if ($nodeWasFalcons) { "removed, as Falcon had installed it." } else { "left alone, as it was the computer's own." })
